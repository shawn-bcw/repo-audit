[package]
name = "repo-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
comfy-table = "7"
semver = "1"
colored = "3"
toml = "0.8"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
